name: Update ACS Manifest

concurrency:
  group: manifest-sync
  cancel-in-progress: false

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate updated manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_manifest.py --repo "${{ github.repository }}" --output acs-manifest.json

      - name: Commit and push manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acs-manifest.json manifest.json
          if git diff --staged --quiet; then
            echo "No changes to manifests"
          else
            git commit -m "chore(manifest): auto-update manifests from releases"
            git pull --rebase origin main
            git push origin main
          fi
