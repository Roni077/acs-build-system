name: Validate ACS Manifest

on:
  push:
    paths:
      - 'acs-manifest.json'
      - '.github/workflows/validate-manifest.yml'
  pull_request:
    paths:
      - 'acs-manifest.json'
  workflow_dispatch:

jobs:
  validate-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifest structure and URLs
        run: |
          python - << 'EOF'
          import json, sys, urllib.request

          with open('acs-manifest.json', 'r', encoding='utf-8') as f:
              data = json.load(f)

          required_fields = ["manifest_version", "organization", "repository", "packages"]
          for field in required_fields:
              if field not in data:
                  print(f"Error: Missing required field '{field}'", file=sys.stderr)
                  sys.exit(1)

          packages = data.get("packages", [])
          print(f"Validating {len(packages)} packages...")

          errors = 0
          for pkg in packages:
              url = pkg.get("url")
              fn = pkg.get("filename")
              arch = pkg.get("architecture")
              sha = pkg.get("sha256")
              
              if not url or not fn or not arch:
                  print(f"Error: Incomplete package entry: {pkg}", file=sys.stderr)
                  errors += 1
                  continue

              try:
                  req = urllib.request.Request(url, method='HEAD')
                  req.add_header('User-Agent', 'ACS-Build-System-Validator')
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      if resp.status not in (200, 302):
                          print(f"Warning: HTTP {resp.status} for {url}")
              except Exception as e:
                  print(f"Error reaching {url}: {e}", file=sys.stderr)
                  errors += 1

          if errors > 0:
              print(f"Validation failed with {errors} errors.", file=sys.stderr)
              sys.exit(1)

          print("All packages validated successfully!")
          EOF
