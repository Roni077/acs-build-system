name: Auto-Sync All Dynamic Tools

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      tools:
        description: "Select toolchain to synchronize"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ndk
          - build-tools
          - cmake
          - flutter

permissions:
  contents: write

jobs:
  sync-all:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute Master Tool Synchronizer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_all_tools.py \
            --dest "${{ github.repository }}" \
            --tools "${{ github.event.inputs.tools || 'all' }}"

      - name: Commit and Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acs-manifest.json manifest.json
          if git diff --staged --quiet; then
            echo "No changes in manifest."
          else
            git commit -m "chore(manifest): auto-update manifests across all build tools"
            git push origin main
          fi
