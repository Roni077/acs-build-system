name: Auto-Sync Dynamic NDK Releases

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: "Upstream NDK repository"
        required: true
        default: "HomuHomu833/android-ndk-custom"
      specific_tag:
        description: "Optional specific tag to sync (e.g. r30)"
        required: false
        default: ""
      arch:
        description: "Target architecture (ARM only)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a

permissions:
  contents: write

jobs:
  check-and-sync-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run NDK Sync Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ github.event.inputs.specific_tag }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --tag ${{ github.event.inputs.specific_tag }}"
          fi
          if [ -n "${{ github.event.inputs.arch }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --arch ${{ github.event.inputs.arch }}"
          fi

          python scripts/sync_ndk.py \
            --source "${{ github.event.inputs.upstream_repo || 'HomuHomu833/android-ndk-custom' }}" \
            --dest "${{ github.repository }}" \
            $EXTRA_ARGS

      - name: Regenerate Manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_manifest.py --repo "${{ github.repository }}" --output acs-manifest.json

      - name: Commit and Push Updated Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add acs-manifest.json manifest.json
          if git diff --staged --quiet; then
            echo "No changes in manifest."
          else
            git commit -m "chore(manifest): auto-update manifests with new NDK releases"
            git push origin main
          fi
